name: Code Quality

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.13"

      - name: Installer utviklingsavhengigheter
        run: uv sync --locked --only-group dev

      - name: Kjør Ruff
        run: uv run --no-sync ruff check src tests scripts

  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.13"

      - name: Installer prosjekt- og testavhengigheter
        run: uv sync --locked

      - name: Kjør tester
        run: uv run --no-sync pytest -q

  evaluation:
    name: Standard evalueringsport
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          prune-cache: true
          python-version: "3.13"

      - name: Installer prosjekt- og testavhengigheter
        run: uv sync --locked

      - name: Kjør standardkorpus
        run: uv run --no-sync python scripts/evaluate_accuracy.py --output artifacts/evaluation/current.json

      - name: Kontroller mot v1.9.16-baseline
        run: uv run --no-sync python scripts/check_evaluation_regression.py --baseline evaluation/baselines/v1.9.16.json --current artifacts/evaluation/current.json
